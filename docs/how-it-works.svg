<svg viewBox="0 0 1600 860" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="860" rx="20" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1598" height="858" rx="19" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Eyebrow -->
  <rect x="60" y="46" width="6" height="22" fill="#2563EB"/>
  <text x="78" y="63" font-size="15" font-weight="700" letter-spacing="1.5" fill="#2563EB">ASKALEX · HOW A QUESTION BECOMES AN ANSWER</text>

  <!-- Title -->
  <text x="60" y="112" font-size="34" font-weight="800" fill="#0F172A">One skill, one job, every time</text>
  <text x="60" y="144" font-size="17" fill="#475569">Describe the problem in plain language — vague or specific — and the right specialist takes it from there.</text>

  <!-- ===== Row of 4 step cards ===== -->
  <!-- Card 1: ASK -->
  <g>
    <rect x="60" y="190" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="96" cy="226" r="16" fill="#2563EB"/>
    <text x="96" y="231" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="122" y="215" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">STEP</text>
    <text x="122" y="232" font-size="19" font-weight="800" fill="#0F172A">Ask</text>
    <text x="88" y="270" font-size="15" fill="#334155">Describe the problem —</text>
    <text x="88" y="292" font-size="15" fill="#334155">any wording, vague or</text>
    <text x="88" y="314" font-size="15" fill="#334155">specific.</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="382" y1="265" x2="426" y2="265" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Card 2: MATCH -->
  <g>
    <rect x="430" y="190" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="466" cy="226" r="16" fill="#2563EB"/>
    <text x="466" y="231" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="492" y="215" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">STEP</text>
    <text x="492" y="232" font-size="19" font-weight="800" fill="#0F172A">Match</text>
    <text x="458" y="270" font-size="15" fill="#334155">Claude routes to the right</text>
    <text x="458" y="292" font-size="15" fill="#334155">askalex-* skill — or</text>
    <text x="458" y="314" font-size="15" fill="#334155">diagnosis, if unclear.</text>
  </g>

  <!-- Arrow 2->3 -->
  <line x1="752" y1="265" x2="796" y2="265" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Card 3: RETRIEVE -->
  <g>
    <rect x="800" y="190" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="836" cy="226" r="16" fill="#2563EB"/>
    <text x="836" y="231" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="862" y="215" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">STEP</text>
    <text x="862" y="232" font-size="19" font-weight="800" fill="#0F172A">Retrieve</text>
    <text x="828" y="270" font-size="15" fill="#334155">Search the local knowledge</text>
    <text x="828" y="292" font-size="15" fill="#334155">base 2-4 times, each with</text>
    <text x="828" y="314" font-size="15" fill="#334155">a different angle.</text>
  </g>

  <!-- Arrow 3->4 -->
  <line x1="1122" y1="265" x2="1166" y2="265" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Card 4: DIAGNOSE -->
  <g>
    <rect x="1170" y="190" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="1206" cy="226" r="16" fill="#2563EB"/>
    <text x="1206" y="231" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="1232" y="215" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">STEP</text>
    <text x="1232" y="232" font-size="19" font-weight="800" fill="#0F172A">Diagnose</text>
    <text x="1198" y="270" font-size="15" fill="#334155">Synthesize across atoms,</text>
    <text x="1198" y="292" font-size="15" fill="#334155">name the framework, ground</text>
    <text x="1198" y="314" font-size="15" fill="#334155">every claim in what it found.</text>
  </g>

  <!-- ===== Branch label ===== -->
  <text x="800" y="392" font-size="14" font-weight="700" letter-spacing="1" fill="#64748B" text-anchor="middle">THREE WAYS IT ENDS</text>

  <!-- Stem + branch lines -->
  <line x1="800" y1="340" x2="800" y2="410" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="290" y1="410" x2="1310" y2="410" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="290" y1="410" x2="290" y2="452" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="410" x2="800" y2="452" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1310" y1="410" x2="1310" y2="452" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Outcome 1: wrong specialist -->
  <g>
    <rect x="60" y="460" width="460" height="176" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="88" y="498" font-size="13" font-weight="700" letter-spacing="1" fill="#2563EB">NOT THIS SKILL'S JOB</text>
    <text x="88" y="528" font-size="18" font-weight="800" fill="#0F172A">Hand off</text>
    <text x="88" y="558" font-size="15" fill="#334155">To the right askalex-* skill —</text>
    <text x="88" y="580" font-size="15" fill="#334155">same problem, nothing to</text>
    <text x="88" y="602" font-size="15" fill="#334155">re-explain.</text>
  </g>

  <!-- Outcome 2: real answer -->
  <g>
    <rect x="570" y="460" width="460" height="176" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="598" y="498" font-size="13" font-weight="700" letter-spacing="1" fill="#059669">GROUNDED IN ATOMS</text>
    <text x="598" y="528" font-size="18" font-weight="800" fill="#0F172A">Real answer</text>
    <text x="598" y="558" font-size="15" fill="#334155">Named framework, plus three</text>
    <text x="598" y="580" font-size="15" fill="#334155">falsifiable actions to try</text>
    <text x="598" y="602" font-size="15" fill="#334155">this week.</text>
  </g>

  <!-- Outcome 3: thin evidence -->
  <g>
    <rect x="1080" y="460" width="460" height="176" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="1108" y="498" font-size="13" font-weight="700" letter-spacing="1" fill="#B45309">RETRIEVAL CAME BACK THIN</text>
    <text x="1108" y="528" font-size="18" font-weight="800" fill="#0F172A">Say so</text>
    <text x="1108" y="558" font-size="15" fill="#334155">Plainly — never invent a take</text>
    <text x="1108" y="580" font-size="15" fill="#334155">no atom in the base actually</text>
    <text x="1108" y="602" font-size="15" fill="#334155">supports.</text>
  </g>

  <!-- Principle bar -->
  <rect x="60" y="672" width="1480" height="130" rx="14" fill="#0F172A"/>
  <circle cx="96" cy="722" r="6" fill="#2563EB"/>
  <text x="118" y="712" font-size="13" font-weight="700" letter-spacing="1" fill="#93C5FD">RULE</text>
  <text x="118" y="740" font-size="17" fill="#F1F5F9">Diagnosis locates, it never treats — the specialist on the other end of the handoff does the treating.</text>
  <text x="118" y="768" font-size="17" fill="#F1F5F9">One skill, one job, no skill improvises past what it actually retrieved.</text>
</svg>
